name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "${{ github.workspace }}/release.keystore"
          else
            keytool -genkeypair -v \
              -keystore "${{ github.workspace }}/release.keystore" \
              -storepass audioextractor \
              -alias release \
              -keypass audioextractor \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=AudioExtractor, OU=Local, O=Local, L=Local, ST=Local, C=CN"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'audioextractor' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'release' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'audioextractor' }}
        run: gradle assembleRelease --no-daemon

      - name: Copy APK with clean name
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/AudioExtractor-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AudioExtractor-APK
          path: dist/AudioExtractor-release.apk
          retention-days: 30
